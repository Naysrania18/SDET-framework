[pytest]
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html
testpaths = tests
markers =
    smoke: fast sanity checks run on every commit
    regression: full suite
    api: REST API layer
    ui: browser layer (Playwright)
    db: database integrity layer
    etl: source-to-target data validation
    bdd: Gherkin scenarios
